server:
  port: 8080

spring:
  application:
    name: setlog
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/setlog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:setlog}
    password: ${SPRING_DATASOURCE_PASSWORD:setlog}
    hikari:
      pool-name: setlog-hikari
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 1000
      initialization-fail-timeout: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: setlog
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
